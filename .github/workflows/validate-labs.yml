name: Validate HashiCorp Labs

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  terraform-lab:
    name: Validate Terraform Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/terraform/basic-aws-deploy
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
    
    - name: Terraform Format Check
      run: terraform fmt -check
    
    - name: Terraform Init
      run: terraform init
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Update Badge
      if: success()
      run: |
        echo "✅ Terraform Lab - PASSED" >> $GITHUB_STEP_SUMMARY

  vault-lab:
    name: Validate Vault Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/vault/dynamic-secrets
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Vault
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt update && sudo apt install vault
    
    - name: Make scripts executable
      run: chmod +x *.sh
    
    - name: Validate Scripts
      run: |
        bash -n start-vault.sh
        bash -n configure-db-engine.sh
        bash -n generate-credentials.sh
        bash -n verify-credentials.sh
        bash -n cleanup.sh
    
    - name: Update Badge
      if: success()
      run: |
        echo "✅ Vault Lab - PASSED" >> $GITHUB_STEP_SUMMARY

  nomad-lab:
    name: Validate Nomad Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/nomad/container-deploy
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Nomad
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt update && sudo apt install nomad
    
    - name: Validate Nomad Job
      run: nomad job validate webapp.nomad
    
    - name: Make scripts executable
      run: chmod +x *.sh
    
    - name: Validate Scripts
      run: |
        bash -n start-nomad.sh
        bash -n deploy-webapp.sh
        bash -n check-deployment.sh
        bash -n cleanup.sh
    
    - name: Update Badge
      if: success()
      run: |
        echo "✅ Nomad Lab - PASSED" >> $GITHUB_STEP_SUMMARY

  consul-lab:
    name: Validate Consul Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/consul/kv-store
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Consul
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt update && sudo apt install consul
    
    - name: Make scripts executable
      run: chmod +x *.sh
    
    - name: Validate Scripts
      run: |
        bash -n start-consul.sh
        bash -n setup-kv-data.sh
        bash -n read-config.sh
        bash -n generate-config.sh
        bash -n cleanup.sh
    
    - name: Update Badge
      if: success()
      run: |
        echo "✅ Consul Lab - PASSED" >> $GITHUB_STEP_SUMMARY

  vault-radar-lab:
    name: Validate Vault Radar Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/vault-radar/repo-scanning
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Make scripts executable
      run: chmod +x *.sh
    
    - name: Validate Scripts
      run: |
        bash -n create-test-repo.sh
        bash -n scan-local-repo.sh
        bash -n review-results.sh
    
    - name: Test Repository Creation
      run: ./create-test-repo.sh
    
    - name: Verify Test Files
      run: |
        test -f test-repo/config.env
        test -f test-repo/app.py
        test -f test-repo/.env
    
    - name: Update Badge
      if: success()
      run: |
        echo "✅ Vault Radar Lab - PASSED" >> $GITHUB_STEP_SUMMARY

  update-badges:
    name: Update Completion Badges
    runs-on: ubuntu-latest
    needs: [terraform-lab, vault-lab, nomad-lab, consul-lab, vault-radar-lab]
    if: always()
    
    steps:
    - name: Generate Final Report
      run: |
        echo "# 🏆 HashiCorp Labs Validation Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Lab | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Terraform | ${{ needs.terraform-lab.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Vault | ${{ needs.vault-lab.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Nomad | ${{ needs.nomad-lab.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Consul | ${{ needs.consul-lab.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Vault Radar | ${{ needs.vault-radar-lab.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
